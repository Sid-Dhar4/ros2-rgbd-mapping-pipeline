name: ROS 2 Jazzy Build and Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-colcon-common-extensions \
            python3-opencv \
            ros-jazzy-cv-bridge \
            ros-jazzy-message-filters \
            ros-jazzy-sensor-msgs-py \
            ros-jazzy-pcl-conversions \
            ros-jazzy-pcl-ros \
            ros-jazzy-tf2-ros \
            ros-jazzy-ament-cmake-gtest \
            libpcl-dev

      - name: Build packages
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select rgbd_mapping_pipeline map_accumulator_cpp

      - name: Run tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select rgbd_mapping_pipeline map_accumulator_cpp
          colcon test-result --verbose
